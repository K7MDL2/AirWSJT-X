name: Mobile Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Unsigned iOS Simulator build. This validates the full Rust/Tauri/Swift
  # toolchain compiles for iOS on every tagged release, without requiring
  # any Apple Developer signing credentials (simulator builds don't need
  # code signing).
  #
  # A signed on-device/TestFlight build is a follow-up: it additionally
  # needs a provisioning profile matching this app's bundle identifier
  # (us.ad7np.airwsjtx), not just the APPLE_TEAM_ID used for macOS signing.
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Sync app versions from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_VERSION"]
          version = tag[1:] if tag.startswith("v") else tag

          package_json = Path("package.json")
          package_data = json.loads(package_json.read_text(encoding="utf-8"))
          package_data["version"] = version
          package_json.write_text(json.dumps(package_data, indent=2) + "\n", encoding="utf-8")

          tauri_conf = Path("src-tauri/tauri.conf.json")
          tauri_data = json.loads(tauri_conf.read_text(encoding="utf-8"))
          tauri_data["version"] = version
          tauri_conf.write_text(json.dumps(tauri_data, indent=2) + "\n", encoding="utf-8")

          cargo_toml = Path("src-tauri/Cargo.toml")
          cargo_text = cargo_toml.read_text(encoding="utf-8")
          cargo_text, replaced = re.subn(
              r'(?m)^version\s*=\s*"[^\"]+"$',
              f'version = "{version}"',
              cargo_text,
              count=1,
          )
          if replaced != 1:
              raise SystemExit("Failed to update src-tauri/Cargo.toml version")
          cargo_toml.write_text(cargo_text, encoding="utf-8")
          PY

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run iOS packaging static tests
        run: python -m unittest tests.test_ios_packaging -v

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Rust stable with iOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize Tauri iOS project
        run: npx tauri ios init

      - name: Apply AirWSJT-X app icons
        run: cp src-tauri/icons/ios/*.png src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset/

      - name: Build unsigned iOS Simulator app
        run: npx tauri ios build --debug --target aarch64-sim --no-sign --ci

      - name: Package iOS Simulator artifact
        run: |
          APP=$(find src-tauri/gen/apple -name "*.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "No .app bundle found under src-tauri/gen/apple"
            exit 1
          fi
          # Unsigned simulator apps cannot use the Keychain (errSecMissingEntitlement),
          # which breaks credential storage. Ad-hoc signing fixes it.
          codesign --force --sign - "$APP"
          tar czf /tmp/AirWSJT-X-ios-simulator.tar.gz -C "$(dirname "$APP")" "$(basename "$APP")"

      - uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-build
          path: /tmp/AirWSJT-X-ios-simulator.tar.gz

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: /tmp/AirWSJT-X-ios-simulator.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Sync app versions from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_VERSION"]
          version = tag[1:] if tag.startswith("v") else tag

          package_json = Path("package.json")
          package_data = json.loads(package_json.read_text(encoding="utf-8"))
          package_data["version"] = version
          package_json.write_text(json.dumps(package_data, indent=2) + "\n", encoding="utf-8")

          tauri_conf = Path("src-tauri/tauri.conf.json")
          tauri_data = json.loads(tauri_conf.read_text(encoding="utf-8"))
          tauri_data["version"] = version
          tauri_conf.write_text(json.dumps(tauri_data, indent=2) + "\n", encoding="utf-8")

          cargo_toml = Path("src-tauri/Cargo.toml")
          cargo_text = cargo_toml.read_text(encoding="utf-8")
          cargo_text, replaced = re.subn(
              r'(?m)^version\s*=\s*"[^\"]+"$',
              f'version = "{version}"',
              cargo_text,
              count=1,
          )
          if replaced != 1:
              raise SystemExit("Failed to update src-tauri/Cargo.toml version")
          cargo_toml.write_text(cargo_text, encoding="utf-8")
          PY

      # ── Pre-build: static packaging tests (no SDK/NDK required) ──────────
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run Android packaging static tests
        run: python -m unittest tests.test_android_packaging -v

      # ── Toolchain setup ───────────────────────────────────────────────────
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install Android NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Install frontend dependencies
        run: npm ci

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Initialize Tauri Android
        run: npx tauri android init

      - name: Build Android APK flavors
        run: npx tauri android build --apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Locate, align, and sign APKs ─────────────────────────────────────
      - name: Find and sign APK flavors
        id: find_apks
        run: |
          mapfile -t APKS < <(find src-tauri/gen/android/app/build/outputs/apk -name "*-release-unsigned.apk" -type f | sort)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "No release APKs found under src-tauri/gen/android/app/build/outputs/apk"
            find src-tauri/gen/android -type f | head -20
            exit 1
          fi

          # Generate a debug keystore for signing
          keytool -genkeypair -v \
            -keystore /tmp/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

          BUILD_TOOLS="${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools/ | sort -V | tail -1)"
          mkdir -p /tmp/android-signed
          : > /tmp/android-signed/apk-list.txt

          for APK in "${APKS[@]}"; do
            NAME=$(basename "$APK")
            BASE="${NAME%-unsigned.apk}"
            ALIGNED="/tmp/${BASE}-aligned.apk"
            SIGNED="/tmp/android-signed/${BASE}.apk"

            "${BUILD_TOOLS}/zipalign" -f 4 "$APK" "$ALIGNED"

            "${BUILD_TOOLS}/apksigner" sign \
              --ks /tmp/debug.keystore \
              --ks-key-alias androiddebugkey \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "$SIGNED" \
              "$ALIGNED"

            "${BUILD_TOOLS}/apksigner" verify "$SIGNED"
            echo "$SIGNED" >> /tmp/android-signed/apk-list.txt
            echo "APK found and signed: $APK -> $SIGNED"
          done

          echo "signed_apk_dir=/tmp/android-signed" >> $GITHUB_OUTPUT
          echo "signed_apk_list=/tmp/android-signed/apk-list.txt" >> $GITHUB_OUTPUT

      # ── Post-build APK validation ─────────────────────────────────────────
      - name: Validate APK flavors — manifest, version, signing, architectures
        run: |
          set -euo pipefail
          mapfile -t APKS < "${{ steps.find_apks.outputs.signed_apk_list }}"
          if [ "${#APKS[@]}" -lt 2 ]; then
            echo "Expected multiple APK flavors, found ${#APKS[@]}"
            printf '%s\n' "${APKS[@]}"
            exit 1
          fi

          AAPT2=$(find "$ANDROID_HOME/build-tools" -name "aapt2"     | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name "zipalign"  | sort -V | tail -1)
          echo "aapt2:     $AAPT2"
          echo "apksigner: $APKSIGNER"
          echo "zipalign:  $ZIPALIGN"

          PASS=0; FAIL=0
          check() {
            local label="$1" result="$2"
            if [ "$result" = "ok" ]; then
              echo "  PASS  $label"; PASS=$((PASS+1))
            else
              echo "  FAIL  $label -- $result"; FAIL=$((FAIL+1))
            fi
          }

          EXPECTED_PKG=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['identifier'])")
          EXPECTED_VER=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          for APK in "${APKS[@]}"; do
            NAME=$(basename "$APK")
            echo ""
            echo "Validating $NAME"
            BADGING=$("$AAPT2" dump badging "$APK")
            echo "$BADGING"

            ACTUAL_PKG=$(echo "$BADGING" | grep -oP "package: name='\K[^']+" || true)
            if [ "$ACTUAL_PKG" = "$EXPECTED_PKG" ]; then
              check "$NAME package name = $EXPECTED_PKG" ok
            else
              check "$NAME package name = $EXPECTED_PKG" "got '$ACTUAL_PKG'"
            fi

            VNAME=$(echo "$BADGING" | grep -oP "versionName='\K[^']+" || true)
            if [ -n "$VNAME" ]; then
              check "$NAME versionName present ($VNAME)" ok
            else
              check "$NAME versionName present" "missing or empty"
            fi

            if [ "$VNAME" = "$EXPECTED_VER" ]; then
              check "$NAME versionName matches tauri.conf.json ($EXPECTED_VER)" ok
            else
              check "$NAME versionName matches tauri.conf.json ($EXPECTED_VER)" "APK has '$VNAME'"
            fi

            VCODE=$(echo "$BADGING" | grep -oP "versionCode='\K[^']+" || true)
            if [ -n "$VCODE" ]; then
              check "$NAME versionCode present ($VCODE)" ok
            else
              check "$NAME versionCode present" "missing"
            fi

            MIN_SDK=$(echo "$BADGING" | grep -oP "minSdkVersion:'\K[0-9]+" || true)
            if [ -n "$MIN_SDK" ]; then
              check "$NAME minSdkVersion present ($MIN_SDK)" ok
            else
              check "$NAME minSdkVersion present" "missing"
            fi

            TGT_SDK=$(echo "$BADGING" | grep -oP "targetSdkVersion:'\K[0-9]+" || true)
            if [ -n "$TGT_SDK" ]; then
              check "$NAME targetSdkVersion present ($TGT_SDK)" ok
            else
              check "$NAME targetSdkVersion present" "missing"
            fi

            if "$APKSIGNER" verify --verbose "$APK" 2>&1 | grep -q "Verified using"; then
              check "$NAME is signed" ok
            else
              check "$NAME is signed" "apksigner verify failed — APK is unsigned or has invalid signature"
            fi

            if "$ZIPALIGN" -c -v 4 "$APK" > /dev/null 2>&1; then
              check "$NAME is zip-aligned (4-byte)" ok
            else
              check "$NAME is zip-aligned (4-byte)" "zipalign check failed"
            fi

            case "$NAME" in
              *universal*)
                if unzip -l "$APK" | grep -q "lib/arm64-v8a/"; then
                  check "$NAME arm64-v8a native library present" ok
                else
                  check "$NAME arm64-v8a native library present" "missing"
                fi
                if unzip -l "$APK" | grep -q "lib/armeabi-v7a/"; then
                  check "$NAME armeabi-v7a native library present" ok
                else
                  check "$NAME armeabi-v7a native library present" "missing"
                fi
                ;;
              *arm64*)
                if unzip -l "$APK" | grep -q "lib/arm64-v8a/"; then
                  check "$NAME arm64-v8a native library present" ok
                else
                  check "$NAME arm64-v8a native library present" "missing"
                fi
                ;;
              *arm-release*)
                if unzip -l "$APK" | grep -q "lib/armeabi-v7a/"; then
                  check "$NAME armeabi-v7a native library present" ok
                else
                  check "$NAME armeabi-v7a native library present" "missing"
                fi
                ;;
              *x86_64*)
                if unzip -l "$APK" | grep -q "lib/x86_64/"; then
                  check "$NAME x86_64 native library present" ok
                else
                  check "$NAME x86_64 native library present" "missing"
                fi
                ;;
            esac

            SIZE=$(stat -c%s "$APK")
            if [ "$SIZE" -ge 100000 ]; then
              check "$NAME size >= 100 KB ($SIZE bytes)" ok
            else
              check "$NAME size >= 100 KB" "only $SIZE bytes — possible empty/corrupt build"
            fi
          done

          echo ""
          echo "Results: $PASS passed, $FAIL failed"
          [ "$FAIL" -eq 0 ] || exit 1

      # ── Artifacts & release ───────────────────────────────────────────────
      - name: Upload Android artifact
        if: always() && steps.find_apks.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: android-build
          path: ${{ steps.find_apks.outputs.signed_apk_dir }}/*.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.find_apks.outputs.signed_apk_dir }}/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}