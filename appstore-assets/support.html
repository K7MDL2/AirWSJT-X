<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support — AirWSJT-X</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; color: #1d1d1f; line-height: 1.6; }
    h1 { font-size: 28px; margin-bottom: 4px; }
    h2 { font-size: 20px; margin-top: 32px; }
    .subtitle { color: #6e6e73; font-size: 16px; margin-bottom: 32px; }
    a { color: #0066cc; }
    .card { background: #f5f5f7; border-radius: 12px; padding: 20px 24px; margin: 16px 0; }
    .card h3 { margin-top: 0; font-size: 17px; }
    form { display: grid; gap: 16px; }
    label { display: grid; gap: 4px; font-weight: 500; font-size: 14px; }
    input, select, textarea { padding: 10px 12px; border: 1px solid #d2d2d7; border-radius: 8px; font-size: 15px; font-family: inherit; }
    textarea { min-height: 120px; resize: vertical; }
    button[type="submit"] { background: #0066cc; color: white; border: none; border-radius: 8px; padding: 12px; font-size: 16px; font-weight: 600; cursor: pointer; }
    button[type="submit"]:hover { background: #0055b3; }
  </style>
</head>
<body>
  <h1>AirWSJT-X Support</h1>
  <p class="subtitle">Aircraft scatter automation for WSJT-X on 23 cm and above</p>

  <div class="card">
    <h3>Quick Links</h3>
    <ul>
      <li><a href="https://ad7np.us/AirWSJT-X">AirWSJT-X Home Page</a></li>
      <li><a href="https://github.com/cpicoto/AirWSJT-X/releases/latest">Latest Release &amp; Downloads</a></li>
      <li><a href="https://github.com/cpicoto/AirWSJT-X/issues">Report a Bug on GitHub</a></li>
      <li><a href="https://ad7np.us/Privacy/AirWSJT-X">Privacy Policy</a></li>
    </ul>
  </div>

  <h2>Contact Support</h2>
  <p>Need help with AirWSJT-X? Describe the issue below and we'll get back to you.</p>

  <form action="https://formspree.io/f/placeholder" method="POST">
    <label>Your Name
      <input type="text" name="name" required>
    </label>
    <label>Email
      <input type="email" name="email" required>
    </label>
    <label>Platform
      <select name="platform">
        <option value="macOS">macOS</option>
        <option value="Windows">Windows</option>
        <option value="Linux">Linux</option>
        <option value="Android">Android</option>
        <option value="iOS">iOS</option>
      </select>
    </label>
    <label>App Version (if known)
      <input type="text" name="version" placeholder="e.g. 0.3.13">
    </label>
    <label>Describe the Issue
      <textarea name="message" required placeholder="What happened? What did you expect to happen?"></textarea>
    </label>
    <button type="submit">Send</button>
  </form>
</body>
</html>
